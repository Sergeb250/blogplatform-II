# ==========================================================
# dev: local MySQL with the existing bloggingPlatform database
# Password comes from the DB_PASSWORD environment variable (never committed).
# ==========================================================
blog.environment=dev
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloggingPlatform?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=BlogDevPool
spring.datasource.hikari.maximum-pool-size=5

# Verbose logs while developing (JdbcTemplate prints every SQL statement)
logging.level.com.amali.blogPlatform=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

spring.graphql.graphiql.enabled=true
springdoc.swagger-ui.enabled=true
