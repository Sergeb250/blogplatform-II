# ==========================================================
# test: in-memory H2 in MySQL mode, created fresh for every test run
# ==========================================================
blog.environment=test
server.port=${SERVER_PORT:8081}

# a random name gives every test context its own fresh database
spring.datasource.url=jdbc:h2:mem:blog-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

logging.level.com.amali.blogPlatform=INFO

spring.graphql.graphiql.enabled=true
spring.sql.init.mode=always
