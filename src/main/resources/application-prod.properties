# ==========================================================
# prod: every connection setting comes from environment variables
# ==========================================================
blog.environment=prod
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=BlogProdPool
spring.datasource.hikari.maximum-pool-size=20

logging.level.root=WARN
logging.level.com.amali.blogPlatform=INFO

# No interactive tools in production
spring.graphql.graphiql.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
server.error.include-stacktrace=never
