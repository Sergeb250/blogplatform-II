# ==========================================================
# Shared settings (every profile). Profile files override these.
# ==========================================================
spring.application.name=blogPlatform

# Default profile when none is given (-Dspring-boot.run.profiles=... or SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

# Each profile has its own port (dev 8080, test 8081, prod 8082) so they can run side by side.
# SERVER_PORT overrides it in any profile.
server.port=${SERVER_PORT:8080}

# Typed settings bound to config/AppProperties
blog.name=Blogging Platform API
blog.version=1.0.0

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Return the ApiResponse error format instead of HTML for unknown URLs (handled in Phase 5)
spring.mvc.problemdetails.enabled=false

# Swagger UI / OpenAPI (Phase 6)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# GraphQL endpoint (Phase 7)
spring.graphql.path=/graphql

# Do not run schema.sql / data.sql unless a profile asks for it
spring.sql.init.mode=never

# AOP monitoring (Phase 8): service methods slower than this are logged as WARN "SLOW: ..."
blog.monitoring.slow-threshold-ms=500

# Swagger UI "Servers" drop-down (config/OpenApiConfig): one entry per profile.
# The running profile is listed first and marked "(active)". Override a URL with its environment variable.
blog.servers[0].profile=dev
blog.servers[0].url=${DEV_SERVER_URL:http://localhost:8080}
blog.servers[0].description=Development: local MySQL (bloggingPlatform), SQL logging, GraphiQL on
blog.servers[1].profile=test
blog.servers[1].url=${TEST_SERVER_URL:http://localhost:8081}
blog.servers[1].description=Test: in-memory H2 database with sample data
blog.servers[2].profile=prod
blog.servers[2].url=${PROD_SERVER_URL:http://localhost:8082}
blog.servers[2].description=Production: settings from environment variables, Swagger and GraphiQL off
